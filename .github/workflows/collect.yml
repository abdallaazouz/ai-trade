name: collect
on:
  schedule:
    - cron: "*/5 * * * *"      # أقل فاصل يسمح به GitHub (قد يتأخر أحيانًا)
  workflow_dispatch:
concurrency:
  group: state
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      PAIRS: ${{ vars.PAIRS || 'EURUSD' }}
      IQ_EMAIL: ${{ secrets.IQ_EMAIL }}
      IQ_PASSWORD: ${{ secrets.IQ_PASSWORD }}
      SHEETS_WEBHOOK_URL: ${{ secrets.SHEETS_WEBHOOK_URL }}
      SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
      DATA_DIR: ${{ github.workspace }}/state
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          pip install -r requirements.txt
          pip install git+https://github.com/iqoptionapi/iqoptionapi.git
      - run: scripts/state.sh pull
      - run: python worker/cycle.py collect
      - run: scripts/state.sh push

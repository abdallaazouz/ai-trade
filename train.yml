name: train
on:
  schedule:
    - cron: "17 */6 * * *"     # كل 6 ساعات
  workflow_dispatch:
concurrency:
  group: state
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PAIRS: ${{ vars.PAIRS || 'BTCUSDT' }}
      SHEETS_WEBHOOK_URL: ${{ secrets.SHEETS_WEBHOOK_URL }}
      SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
      DATA_DIR: ${{ github.workspace }}/state
      OFFLINE: "1"              # التدريب لا يحتاج اتصالًا بالمنصة
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: bash scripts/state.sh pull
      - run: python worker/cycle.py train
      - run: bash scripts/state.sh upload-models
      - run: bash scripts/state.sh push
